name: Dafin release (add Linux)

# Adds the Linux AppImage to a Dafin release that was published with only the Windows files
# (releases before dafin-release.yml built Linux too, e.g. v3.2.0). Builds the AppImage from that
# release's tag, with the app reporting that version, uploads it as Dafin-<version>-x86_64.AppImage,
# adds its line to SHA256SUMS and an install line to the release notes. The Windows files are not
# touched. Refuses a release that already has an AppImage.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release to add Linux to, e.g. 3.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dafin-release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not '${VERSION}'"
            exit 1
          fi
          if ! gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${version} does not exist"
            exit 1
          fi
          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" --json assets \
               --jq '.assets[].name' | grep -q 'x86_64\.AppImage$'; then
            echo "::error::Release v${version} already has a Linux AppImage"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  package:
    name: Package (Linux)
    needs: verify
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      app_version: ${{ needs.verify.outputs.version }}
      platforms: linux
      ref: v${{ needs.verify.outputs.version }}
    secrets: inherit

  attach:
    name: Add to the release
    runs-on: ubuntu-latest
    needs: [verify, package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linux-appimage-*

      - name: Upload the AppImage, SHA256SUMS and notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          name="Dafin-${VERSION}-x86_64.AppImage"
          src="$(ls dist/linux-appimage-x86_64/*-x86_64.AppImage | head -n 1)"
          test -f "${src}"
          mv "${src}" "${name}"
          chmod +x "${name}"

          # Keep the Windows lines exactly as published; add (or replace) the AppImage line.
          mkdir -p old
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir old || true
          touch old/SHA256SUMS
          grep -v ' Dafin-.*-x86_64\.AppImage$' old/SHA256SUMS > SHA256SUMS || true
          sha256sum "${name}" >> SHA256SUMS
          cat SHA256SUMS

          gh release upload "${tag}" --repo "${GITHUB_REPOSITORY}" --clobber "${name}" SHA256SUMS

          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > notes.md
          if ! grep -q 'Linux AppImage' notes.md; then
            printf '%s\n' "- **Linux AppImage** (any distro): \`chmod +x ${name} && ./${name}\`" >> notes.md
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
          fi
